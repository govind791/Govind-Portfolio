<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>

    <!-- Gradient -->
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Arrow -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="#F9FAFB"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" font-size="24" font-family="Inter, sans-serif" fill="#111827" font-weight="600">
    MultiModel RAG Pipeline
  </text>

  <!-- ROW 1 (INGESTION) -->
  <rect x="120" y="90" width="150" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="195" y="115" text-anchor="middle" font-size="13" fill="#374151">Upload</text>

  <rect x="300" y="90" width="160" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="380" y="115" text-anchor="middle" font-size="13" fill="#374151">OCR + Extract</text>

  <rect x="490" y="90" width="150" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="565" y="115" text-anchor="middle" font-size="13" fill="#374151">Chunking</text>

  <rect x="670" y="90" width="140" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="740" y="115" text-anchor="middle" font-size="13" fill="#374151">FAISS DB</text>

  <!-- ROW 2 (QUERY FLOW) -->
  <rect x="120" y="260" width="120" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="180" y="285" text-anchor="middle" font-size="13" fill="#374151">User</text>

  <rect x="260" y="260" width="140" height="50" rx="14" fill="url(#grad)" filter="url(#shadow)"/>
  <text x="330" y="285" text-anchor="middle" font-size="13" fill="white">FastAPI</text>

  <rect x="420" y="260" width="150" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="495" y="285" text-anchor="middle" font-size="13" fill="#374151">Embed Query</text>

  <rect x="590" y="260" width="160" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="670" y="285" text-anchor="middle" font-size="13" fill="#374151">Similarity Search</text>

  <rect x="770" y="260" width="140" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="840" y="285" text-anchor="middle" font-size="13" fill="#374151">Re-rank</text>

  <!-- LLM + OUTPUT -->
  <rect x="820" y="160" width="120" height="55" rx="16" fill="url(#grad)" filter="url(#shadow)"/>
  <text x="880" y="190" text-anchor="middle" font-size="13" fill="white">LLM</text>

  <rect x="820" y="330" width="120" height="50" rx="14" fill="white" filter="url(#shadow)"/>
  <text x="880" y="355" text-anchor="middle" font-size="13" fill="#374151">Response</text>

  <!-- CONNECTIONS -->
  <g stroke="#D1D5DB" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    
    <!-- Top Row -->
    <path d="M270 115 L300 115"/>
    <path d="M460 115 L490 115"/>
    <path d="M640 115 L670 115"/>

    <!-- Bottom Row -->
    <path d="M240 285 L260 285"/>
    <path d="M400 285 L420 285"/>
    <path d="M570 285 L590 285"/>
    <path d="M750 285 L770 285"/>

    <!-- Vertical Links -->
    <path d="M380 140 C380 200, 495 200, 495 260"/>
    <path d="M740 140 C740 200, 670 200, 670 260"/>

    <!-- To LLM -->
    <path d="M910 285 C940 260, 940 210, 940 190"/>

    <!-- LLM to Output -->
    <path d="M880 215 L880 330"/>

  </g>

</svg>